name: SonarCloud

on:
  push:
    branches:
      - master
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: ${{ format('sonarcloud-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Test and analyze
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Backend tests with coverage
        working-directory: pocketr-api
        run: ./gradlew test jacocoTestReport --no-daemon

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: pocketr-ui/package-lock.json

      - name: Install frontend dependencies
        working-directory: pocketr-ui
        run: npm ci --ignore-scripts

      - name: Frontend tests with coverage
        working-directory: pocketr-ui
        run: npm run test:coverage

      # Fork and Dependabot PRs have no secrets: tests still run, then the job fails
      # so an unscanned PR cannot pass the required check.
      - name: Require SONAR_TOKEN
        if: env.SONAR_TOKEN == ''
        run: |
          echo "::error::SONAR_TOKEN is unavailable (fork or Dependabot PR), so the Quality Gate cannot be checked."
          exit 1

      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        with:
          # Fail this job when the Quality Gate fails, so branch rules can block the merge.
          args: -Dsonar.qualitygate.wait=true
