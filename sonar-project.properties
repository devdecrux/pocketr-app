# SonarQube Cloud CI-based analysis, run by .github/workflows/sonarcloud.yml.
# Coverage reports are produced before the scan:
#   backend:  pocketr-api ./gradlew test jacocoTestReport
#   frontend: pocketr-ui  npm run test:coverage
sonar.organization=devdecrux
sonar.projectKey=devdecrux_pocketr-app

sonar.sources=pocketr-api/src/main,pocketr-ui/src,pocketr-docs/src
sonar.tests=pocketr-api/src/test,pocketr-ui/src/__tests__,pocketr-ui/e2e

# pocketr-ui/src/__tests__ sits inside a source dir; a file cannot be both source and test.
sonar.exclusions=pocketr-ui/src/__tests__/**,**/dist/**,**/build/**,**/.docusaurus/**,**/node_modules/**,**/auto-imports.d.ts,**/components.d.ts

sonar.coverage.jacoco.xmlReportPaths=pocketr-api/build/reports/jacoco/test/jacocoTestReport.xml
sonar.javascript.lcov.reportPaths=pocketr-ui/coverage/lcov.info
